<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Bioinfor-Claw — Bioinformatics Copilot">
  <title>Bioinfor-Claw — Bioinformatics Copilot</title>

  <defs>
    <!-- Background gradient (very soft, paper-like) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#f6fbf5"/>
      <stop offset="100%" stop-color="#eaf5e8"/>
    </linearGradient>

    <!-- Icon tile gradient -->
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>

    <!-- Wordmark gradient -->
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#2e6b35"/>
      <stop offset="100%" stop-color="#0b8a7a"/>
    </linearGradient>

    <!-- DNA strand gradients -->
    <linearGradient id="strandA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#0b8a7a"/>
    </linearGradient>
    <linearGradient id="strandB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0b8a7a"/>
      <stop offset="100%" stop-color="#66bb6a"/>
    </linearGradient>

    <!-- Protein helix gradient (teal/cyan to differentiate from DNA green) -->
    <linearGradient id="helixGrad" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%"  stop-color="#4db6ac"/>
      <stop offset="55%" stop-color="#00897b"/>
      <stop offset="100%" stop-color="#00695c"/>
    </linearGradient>
    <linearGradient id="helixGradDark" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%"  stop-color="#26a69a"/>
      <stop offset="100%" stop-color="#004d40"/>
    </linearGradient>

    <!-- Soft drop shadow -->
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="4" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Stat pill gradients -->
    <linearGradient id="pillG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/><stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="pillT" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f2f1"/><stop offset="100%" stop-color="#b2dfdb"/>
    </linearGradient>
    <linearGradient id="pillB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e3f2fd"/><stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
    <linearGradient id="pillY" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8e1"/><stop offset="100%" stop-color="#ffecb3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- ===== Left: Animated icon tile ===== -->
  <g transform="translate(200 200)" filter="url(#soft)">
    <!-- Rounded tile -->
    <rect x="-120" y="-120" width="240" height="240" rx="48" ry="48"
          fill="url(#iconBg)" stroke="#66bb6a" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Outer rotating ring -->
    <g>
      <circle cx="0" cy="0" r="100" fill="none"
              stroke="#66bb6a" stroke-width="1.6" stroke-opacity="0.45"
              stroke-dasharray="4 8"/>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite"/>
    </g>

    <!-- Inner ring (reverse) -->
    <g>
      <circle cx="0" cy="0" r="84" fill="none"
              stroke="#0b8a7a" stroke-width="1.2" stroke-opacity="0.3"
              stroke-dasharray="2 6"/>
      <animateTransform attributeName="transform" type="rotate"
                        from="360 0 0" to="0 0 0" dur="28s" repeatCount="indefinite"/>
    </g>

    <!-- Floating DNA + central-dogma arrow + Protein alpha helix -->
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 -5; 0 5; 0 -5" dur="4s" repeatCount="indefinite"/>

      <!-- ===== DNA (left side) ===== -->
      <g transform="translate(-48 0)">
        <!-- Strand A -->
        <path d="M 0 -55 Q 24 -37 0 -18 T 0 18 T 0 55"
              fill="none" stroke="url(#strandA)" stroke-width="4.5" stroke-linecap="round"/>
        <!-- Strand B (mirror) -->
        <path d="M 0 -55 Q -24 -37 0 -18 T 0 18 T 0 55"
              fill="none" stroke="url(#strandB)" stroke-width="4.5" stroke-linecap="round"/>

        <!-- Base pair rungs -->
        <g stroke="#558b2f" stroke-width="2.6" stroke-linecap="round" opacity="0.78">
          <line x1="-17" y1="-37" x2="17" y2="-37"/>
          <line x1="-19" y1="0"   x2="19" y2="0"/>
          <line x1="-17" y1="37"  x2="17" y2="37"/>
        </g>

        <!-- Nucleotide dots -->
        <g fill="#2e7d32">
          <circle cx="-17" cy="-37" r="3"/>
          <circle cx="17"  cy="-37" r="3"/>
          <circle cx="-19" cy="0"   r="3"/>
          <circle cx="19"  cy="0"   r="3"/>
          <circle cx="-17" cy="37"  r="3"/>
          <circle cx="17"  cy="37"  r="3"/>
        </g>

        <!-- Tiny "DNA" label -->
        <text x="0" y="-68" text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="10" font-weight="700" fill="#2e6b35" letter-spacing="0.8">DNA</text>
      </g>

      <!-- ===== Central-dogma arrow (transcription + translation) ===== -->
      <g opacity="0.7">
        <!-- faint arc showing flow -->
        <path d="M -18 -2 C -6 -10, 6 -10, 18 -2"
              fill="none" stroke="#0b8a7a" stroke-width="1.3"
              stroke-dasharray="2 2.5" stroke-linecap="round"/>
        <!-- arrowhead -->
        <path d="M 14 -4 L 19 -2 L 14 1"
              fill="none" stroke="#0b8a7a" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/>
        <!-- tiny mRNA dot pulsing along the flow -->
        <circle cx="0" cy="-7" r="2" fill="#0b8a7a">
          <animate attributeName="cx" values="-14;14;-14" dur="3.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- ===== Protein alpha helix (right side) ===== -->
      <g transform="translate(48 0)">
        <!-- Backbone spine -->
        <line x1="0" y1="-56" x2="0" y2="56"
              stroke="#004d40" stroke-width="1.3" stroke-dasharray="1.5 2.5" opacity="0.55"/>

        <!-- Helix turns (7 stacked ellipses — classic ribbon view) -->
        <g stroke="#004d40" stroke-width="0.8">
          <ellipse cx="0" cy="-48" rx="18" ry="5.5" fill="url(#helixGrad)"/>
          <ellipse cx="0" cy="-32" rx="18" ry="5.5" fill="url(#helixGrad)"/>
          <ellipse cx="0" cy="-16" rx="18" ry="5.5" fill="url(#helixGrad)"/>
          <ellipse cx="0" cy="0"   rx="18" ry="5.5" fill="url(#helixGradDark)"/>
          <ellipse cx="0" cy="16"  rx="18" ry="5.5" fill="url(#helixGrad)"/>
          <ellipse cx="0" cy="32"  rx="18" ry="5.5" fill="url(#helixGrad)"/>
          <ellipse cx="0" cy="48"  rx="18" ry="5.5" fill="url(#helixGrad)"/>
        </g>

        <!-- Side-chain stubs (alternating sides to evoke residues) -->
        <g stroke="#00695c" stroke-width="1.4" stroke-linecap="round" opacity="0.85">
          <line x1="-18" y1="-48" x2="-26" y2="-50"/>
          <line x1="18"  y1="-32" x2="26"  y2="-34"/>
          <line x1="-18" y1="-16" x2="-26" y2="-18"/>
          <line x1="18"  y1="0"   x2="26"  y2="-2"/>
          <line x1="-18" y1="16"  x2="-26" y2="14"/>
          <line x1="18"  y1="32"  x2="26"  y2="30"/>
          <line x1="-18" y1="48"  x2="-26" y2="46"/>
        </g>
        <!-- Side-chain terminal dots -->
        <g fill="#00695c">
          <circle cx="-27" cy="-50" r="1.8"/>
          <circle cx="27"  cy="-34" r="1.8"/>
          <circle cx="-27" cy="-18" r="1.8"/>
          <circle cx="27"  cy="-2"  r="1.8"/>
          <circle cx="-27" cy="14"  r="1.8"/>
          <circle cx="27"  cy="30"  r="1.8"/>
          <circle cx="-27" cy="46"  r="1.8"/>
        </g>

        <!-- Subtle "breathing" animation on the whole helix (slight scaleY) -->
        <animateTransform attributeName="transform" type="translate"
                          values="48 0; 48 -1; 48 0; 48 1; 48 0"
                          dur="5s" repeatCount="indefinite" additive="replace"/>

        <!-- Tiny "Protein" label -->
        <text x="0" y="-68" text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="10" font-weight="700" fill="#00695c" letter-spacing="0.8">PROTEIN</text>
      </g>
    </g>

    <!-- Pulsing highlight dot -->
    <circle cx="88" cy="-72" r="6" fill="#0b8a7a">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="r"       values="5;7;5"     dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== Right: Wordmark + tagline + stats ===== -->
  <g transform="translate(370 0)">
    <!-- Wordmark -->
    <text x="0" y="175" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace"
          font-size="78" font-weight="800" fill="url(#title)" letter-spacing="-1.5">
      Bioinfor-Claw
    </text>

    <!-- Subtitle -->
    <text x="4" y="215" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
          font-size="22" font-weight="600" fill="#2e6b35" letter-spacing="0.2">
      Bioinformatics Copilot · Autonomous AI Agent
    </text>

    <!-- Tagline -->
    <text x="4" y="245" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
          font-size="16" fill="#6b7e66" letter-spacing="0.1">
      Your 24/7 copilot — 50 specific skills across 10 application scenarios.
    </text>

    <!-- Stat pills -->
    <g transform="translate(4 275)" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600">
      <!-- pill 1 -->
      <g>
        <rect x="0" y="0" width="150" height="36" rx="18" fill="url(#pillG)" stroke="#a5d6a7" stroke-width="1"/>
        <text x="75" y="23" text-anchor="middle" fill="#2e6b35">⚡ 50 Expert Skills</text>
      </g>
      <!-- pill 2 -->
      <g transform="translate(162 0)">
        <rect x="0" y="0" width="150" height="36" rx="18" fill="url(#pillT)" stroke="#80cbc4" stroke-width="1"/>
        <text x="75" y="23" text-anchor="middle" fill="#00695c">🧬 10 Scenarios</text>
      </g>
      <!-- pill 3 -->
      <g transform="translate(324 0)">
        <rect x="0" y="0" width="160" height="36" rx="18" fill="url(#pillB)" stroke="#90caf9" stroke-width="1"/>
        <text x="80" y="23" text-anchor="middle" fill="#1565c0">🔌 5+ LLM Providers</text>
      </g>
      <!-- pill 4 -->
      <g transform="translate(496 0)">
        <rect x="0" y="0" width="130" height="36" rx="18" fill="url(#pillY)" stroke="#ffd54f" stroke-width="1"/>
        <text x="65" y="23" text-anchor="middle" fill="#8a6d00">📜 MIT License</text>
      </g>
    </g>
  </g>

  <!-- Subtle floating particles -->
  <g opacity="0.45">
    <circle cx="80"  cy="80"  r="3" fill="#66bb6a">
      <animate attributeName="cy" values="80;60;80" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="60" r="2.5" fill="#0b8a7a">
      <animate attributeName="cy" values="60;90;60" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="340" r="3" fill="#66bb6a">
      <animate attributeName="cy" values="340;310;340" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60"  cy="340" r="2.5" fill="#0b8a7a">
      <animate attributeName="cy" values="340;320;340" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
